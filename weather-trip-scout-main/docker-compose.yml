services:
  trip-history:
    build: ./trip-history-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/triphistory
      DATABASE_USERNAME: scout
      DATABASE_PASSWORD: scout
      DATABASE_DRIVER: org.postgresql.Driver
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triphistory
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    volumes:
      - trip_history_data:/var/lib/postgresql/data

  weather-trip-scout:
    build: .
    env_file: .env
    environment:
      TRIP_HISTORY_URL: http://trip-history:8080
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - trip-history

volumes:
  trip_history_data:
